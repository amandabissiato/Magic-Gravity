<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crônicas Medievais - O Prefácio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="moldura-medieval">
        <div class="pergaminho">
            <header>
                <h1 class="titulo-medieval">PREFÁCIO</h1>
                <div class="divisor-estilizado">✦ ⚜ ✦</div>
            </header>
            
            <main>
                <div class="icone-ilustracao">🧙‍♂️</div>
                
                <section id="caixa-texto">
                    <p id="texto-narrativa">Carregando manuscrito medieval...</p>
                </section>
                
                <section id="caixa-escolhas" class="lista-escolhas">
                    <!-- Os botões de ação medieval surgirão dinamicamente aqui -->
                </section>
            </main>
            
            <footer>
                <button id="btn-reiniciar" onclick="iniciarJogo()">Reiniciar Crônica</button>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
<!-- Área do Evento Guerra dos Mundos -->
<section class="container-guerra">
    <div class="card-guerra">
        <!-- Parte 1: Apresentação -->
        <img src="https://ibb.co" alt="Apresentação do Jogo Guerra dos Mundos">
    </div>
    <div class="card-guerra">
        <!-- Parte 2: Informações -->
        <img src="https://ibb.co" alt="Informações do Jogo Guerra dos Mundos">
    </div>
</section>

<!-- Estilo para alinhar tudo perfeitamente -->
<style>
    .container-guerra {
        display: flex;
        justify-content: center;
        gap: 20px; /* Espaço entre os dois lados */
        padding: 40px 20px;
        background-color: #0d0d0d; /* Fundo escuro combinando com o tema */
        flex-wrap: wrap; /* Se a tela for pequena (celular), uma fica embaixo da outra */
    }

    .card-guerra {
        max-width: 480px; /* Tamanho máximo ideal para não distorcer */
        width: 100%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8); /* Sombra preta ao redor */
        border: 2px solid #c5a059; /* Bordinha dourada combinando com o panfleto */
        border-radius: 10px;
        overflow: hidden;
    }

    .card-guerra img {
        width: 100%;
        height: auto;
        display: block;
    }
</style>
