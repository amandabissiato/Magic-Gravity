<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Rocha Chueiri — uma cidadela arcana e fortaleza mágica ancestral escondida entre as Montanhas Nebulosas."
  >

  <meta name="theme-color" content="#1c1a17">

  <title>Rocha Chueiri | RPG Medieval</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Inclusão e correção das fontes medievais, heráldicas e serifadas clássicas -->
  <link
    href="https://googleapis.com"
    rel="stylesheet"
  >

  <style>
    /* ==========================================================================
       PALETA DE CORES MEDIEVAIS HERÁLDICAS
       ========================================================================== */
    :root {
      --bg: #1c1a17;           /* Cinza-pedra escuro de masmorra */
      --bg-stone: #2b2824;     /* Tom de pedra de castelo ou fortificação */
      --crimson: #7a1d1d;      /* Vermelho-carmesim heráldico (guerra e nobreza) */
      --crimson-light: #a62b2b;/* Carmesim vivo iluminado por tochas */
      --parchment: #f4ebd0;    /* Cor de pergaminho antigo de manuscrito */
      --gold: #bfa15f;         /* Dourado envelhecido / bronze heráldico */
      --gold-light: #e6d3a3;   /* Dourado brilhante / latão polido */
      --text: #eadeca;         /* Branco linho antigo (confortável para leitura) */
      --muted: #9e9380;        /* Texto secundário desbotado pelo tempo */
      --border: #4d443a;       /* Ferro forjado antigo ou amarra de couro */
      --card-bg: rgba(43, 40, 36, 0.75); /* Fundo de pedra translúcida */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: 
        radial-gradient(circle at 50% 20%, rgba(122, 29, 29, 0.1), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', serif; /* Tipografia rica de crônicas antigas */
      font-size: 1.2rem;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Textura orgânica simulando as fibras de um papel ou pergaminho velho */
    .parchment-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ==========================================================================
       HEADER & NAVEGAÇÃO
       ========================================================================== */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      padding: 18px 6%;
      background: rgba(28, 26, 23, 0.96);
      border-bottom: 2px solid var(--border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
    }

    nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'MedievalSharp', cursive; /* Estilo caligrafia gótica */
      font-size: 1.6rem;
      color: var(--gold-light);
      letter-spacing: 1px;
      text-decoration: none;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    .logo span {
      color: var(--crimson-light);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      letter-spacing: 1px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .nav-links a:hover {
      color: var(--crimson-light);
      text-shadow: 0 0 8px rgba(166, 43, 43, 0.5);
    }

    .menu {
      display: none;
      background: none;
      border: none;
      color: var(--gold-light);
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* ==========================================================================
       HERO SECTION (ENTRADA DO REINO)
       ========================================================================== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 150px 20px 80px;
      position: relative;
      border-bottom: 4px double var(--border); /* Borda heráldica dupla */
    }

    .hero-content {
      max-width: 850px;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: var(--gold);
      font-family: 'Cinzel', serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-family: 'MedievalSharp', cursive;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.1;
      color: var(--parchment);
      margin-bottom: 25px;
      text-shadow: 3px 3px 0px #000, 0 0 20px rgba(122, 29, 29, 0.3);
    }

    .hero h1 span {
      display: block;
      color: var(--crimson-light);
      font-family: 'Cinzel', serif;
      font-size: 0.38em;
      letter-spacing: 5px;
      margin-top: 15px;
      text-shadow: 2px 2px 0px #000;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
      font-size: 1.3rem;
      font-style: italic;
    }

    /* Botões de Ferro, Aço e Carmesim */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 45px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      border: 2px solid var(--border);
    }

    .btn-primary {
      background: var(--crimson);
      color: var(--parchment);
      border-color: var(--gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: var(--crimson-light);
      color: #fff;
      box-shadow: 0 6px 20px rgba(166, 43, 43, 0.4);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--bg-stone);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
      background: rgba(43, 40, 36, 0.9);
    }

    /* ==========================================================================
       SEÇÕES E DIVISORES
       ========================================================================== */
    section {
      padding: 110px 6%;
      position: relative;
    }

    /* Divisor tipográfico medieval separando blocos */
    section:not(:last-of-type)::after {
      content: "❧  ❖  ☙";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      color: var(--border);
      font-size: 1.4rem;
      letter-spacing: 10px;
      opacity: 0.6;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 65px;
    }

    .section-title small {
      color: var(--gold);
      font-family: 'Cinzel', serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .section-title h2 {
      font-family: 'MedievalSharp', cursive;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--parchment);
      margin-top: 10px;
      text-shadow: 2px 2px 2px rgba(0,0,0,0.7);
    }

    .section-title p {
      color: var(--muted);
      max-width: 650px;
      margin: 14px auto 0;
      font-style: italic;
      font-size: 1.25rem;
    }

    /* ==========================================================================
       LORE & HISTÓRIA
       ========================================================================== */
    .lore {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .lore { grid-template-columns: 1fr; }
    }

    .lore-text h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 1.7rem;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .lore-text p {
      color: var(--text);
      margin-bottom: 18px;
      text-align: justify;
    }

    .quote {
      border-left: 3px solid var(--crimson);
      background: rgba(122, 29, 29, 0.15);
      padding: 18px 22px;
      margin-top: 30px;
      color: var(--parchment);
      font-style: italic;
      font-size: 1.25rem;
      box-shadow: inset 5px 0 10px rgba(0,0,0,0.3);
    }

    .castle {
      min-height: 400px;
      border: 2px solid var(--border);
      background: 
        linear-gradient(to top, var(--bg), transparent),
        radial-gradient(circle at 50% 40%, rgba(122, 29, 29, 0.2), transparent 65%),
        var(--bg-stone);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      box-shadow: inset 0 0 50px #000, 0 10px 25px rgba(0,0,0,0.6);
    }

    /* Silhueta sutil de castelo medieval */
    .castle::before {
      content: "🏰";
      font-size: 9rem;
      filter: sepia(0.3) grayscale(0.2) drop-shadow(0 0 20px rgba(0,0,0,0.9));
      margin-bottom: 50px;
