<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crônicas Medievais - O Prefácio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 ABERTURA DO SITE: BANNER DO EVENTO GUERRA DOS MUNDOS 🌟 -->
    <section class="abertura-guerra">
        <div class="guerra-wrapper">
            <div class="card-guerra">
                <!-- Parte 1: Apresentação -->
                <img src="https://ibb.co" alt="Apresentação do Jogo Guerra dos Mundos">
            </div>
            <div class="card-guerra">
                <!-- Parte 2: Informações -->
                <img src="https://ibb.co" alt="Informações do Jogo Guerra dos Mundos">
            </div>
        </div>
        <div class="seta-rolar">
            <p>Role para baixo para jogar</p>
            <span>🔽</span>
        </div>
    </section>

    <!-- Seu jogo/pergaminho original vem logo em seguida -->
    <div class="moldura-medieval">
        <div class="pergaminho">
            <header>
                <h1 class="titulo-medieval">PREFÁCIO</h1>
                <div class="divisor-estilizado">✦ ⚜ ✦</div>
            </header>
            
            <main>
                <div class="icone-ilustracao">🧙‍♂️</div>
                
                <section id="caixa-texto">
                    <p id="texto-narrativa">Carregando manuscrito medieval...</p>
                </section>
                
                <section id="caixa-escolhas" class="lista-escolhas">
                    <!-- Os botões de ação medieval surgirão dinamicamente aqui -->
                </section>
            </main>
            
            <footer>
                <button id="btn-reiniciar" onclick="iniciarJogo()">Reiniciar Crônica</button>
            </footer>
        </div>
    </div>

    <!-- Estilos específicos para a Abertura -->
    <style>
        /* Define o fundo escuro para o site todo combinar com a abertura */
        body {
            background-color: #0d0d0d;
            margin: 0;
            padding: 0;
        }

        .abertura-guerra {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Ocupa a tela inteira ao abrir */
            padding: 40px 20px;
            box-sizing: border-box;
            background: radial-gradient(circle, #1a1510 0%, #050505 100%);
            border-bottom: 3px double #c5a059; /* Divisor dourado elegante */
        }

        .guerra-wrapper {
            display: flex;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap; /* Se for celular, joga um embaixo do outro */
        }

        .card-guerra {
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            border: 2px solid #c5a059;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* Efeito de zoom de leve ao passar o mouse */
        .card-guerra:hover {
            transform: scale(1.02);
        }

        .card-guerra img {
            width: 100%;
            height: auto;
            display: block;
        }

        .seta-rolar {
            text-align: center;
            margin-top: 30px;
            font-family: serif;
            color: #c5a059;
            letter-spacing: 1px;
            animation: flutuar 2s infinite ease-in-out;
        }

        /* Animação para a setinha ficar subindo e descendo de leve */
        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }
    </style>

    <!-- Script sempre no final do body -->
    <script src="app.js"></script>
</body>
</html>
