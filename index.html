<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crônicas Medievais - O Prefácio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 ABERTURA DO SITE: EXIBIÇÃO IMEDIATA DO EVENTO 🌟 -->
    <section class="abertura-guerra-imediata">
        <div class="guerra-layout-aberto">
            <div class="card-guerra">
                <!-- Parte 1: Apresentação -->
                <img src="https://ibb.co" alt="Apresentação do Jogo Guerra dos Mundos">
            </div>
            <div class="card-guerra">
                <!-- Parte 2: Informações -->
                <img src="https://ibb.co" alt="Informações do Jogo Guerra dos Mundos">
            </div>
        </div>
        
        <div class="indicador-rolagem">
            <p>Role para baixo para ler as crônicas</p>
            <span class="seta-animada">🔽</span>
        </div>
    </section>

    <!-- O pergaminho original do seu jogo vem logo na sequência abaixo -->
    <div class="moldura-medieval">
        <div class="pergaminho">
            <header>
                <h1 class="titulo-medieval">PREFÁCIO</h1>
                <div class="divisor-estilizado">✦ ⚜ ✦</div>
            </header>
            
            <main>
                <div class="icone-ilustracao">🧙‍♂️</div>
                
                <section id="caixa-texto">
                    <p id="texto-narrativa">Carregando manuscrito medieval...</p>
                </section>
                
                <section id="caixa-escolhas" class="lista-escolhas">
                    <!-- Os botões de ação medieval surgirão dinamicamente aqui -->
                </section>
            </main>
            
            <footer>
                <button id="btn-reiniciar" onclick="iniciarJogo()">Reiniciar Crônica</button>
            </footer>
        </div>
    </div>

    <!-- Estilos organizados para garantir que tudo abra 100% visível -->
    <style>
        body {
            background-color: #0d0d0d;
            margin: 0;
            padding: 0;
        }

        /* Seção da abertura configurada para já exibir tudo imediatamente */
        .abertura-guerra-imediata {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Ocupa a tela cheia na entrada do site */
            padding: 40px 20px;
            box-sizing: border-box;
            background: radial-gradient(circle, #1c1611 0%, #050505 100%);
            border-bottom: 3px double #c5a059;
        }

        .guerra-layout-aberto {
            display: flex;
            justify-content: center;
            gap: 25px;
            max-width: 950px;
            width: 100%;
            flex-wrap: wrap; /* Se abrir no celular, as duas metades ficam uma sob a outra perfeitamente */
        }

        .card-guerra {
            max-width: 410px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
            border: 2px solid #c5a059;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-guerra img {
            width: 100%;
            height: auto;
            display: block;
        }

        .indicador-rolagem {
            text-align: center;
            margin-top: 35px;
            font-family: serif;
            color: #c5a059;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .seta-animada {
            display: inline-block;
            margin-top: 5px;
            font-size: 18px;
            animation: balancoSeta 2s infinite ease-in-out;
        }

        /* Animação sutil para a setinha indicar que tem mais conteúdo abaixo */
        @keyframes balancoSeta {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }

        /* Espaçamento extra opcional para o seu pergaminho não ficar colado */
        .moldura-medieval {
            padding-top: 60px;
            padding-bottom: 60px;
        }
    </style>

    <!-- Script de controle do jogo -->
    <script src="app.js"></script>
</body>
</html>
